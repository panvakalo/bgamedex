# fly.toml app configuration file for Bgamedex (playdex-red-wildflower-3387 on Fly.io)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'playdex-red-wildflower-3387'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Launch tier: keep one machine warm so users never eat a cold start.
  # auto_stop stays off until the app is multi-machine-safe (see SCALE.md) —
  # with in-memory rate limits / OAuth state, a 2nd machine would be unsafe today.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[mounts]
  source = 'playdex_data'
  destination = '/data'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
